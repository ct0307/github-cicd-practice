<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CI/CD 静态网页实验</title>
  <link rel="icon" href="data:,">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #172b43; background: #f5f7fa; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; line-height: 1.7; }
    main { max-width: 820px; margin: 64px auto; padding: 0 28px; }
    h1 { font-size: clamp(28px, 6vw, 40px); line-height: 1.3; margin: 8px 0 20px; }
    h2 { font-size: 20px; }
    .course, footer { color: #526174; font-size: 14px; }
    .steps { background: white; border: 1px solid #d7dfe9; border-radius: 12px; padding: 20px 28px; margin: 28px 0; }
    li { padding: 5px 0; }
    a { color: #2458a0; font-weight: 600; text-underline-offset: 4px; }
    code { font-family: Consolas, monospace; overflow-wrap: anywhere; }
    @media(max-width:480px) { main { margin-top: 28px; padding: 0 18px; } .steps { padding: 16px 20px; } }
  </style>
</head>
<body>
  <main>
    <p class="course">实验一 · GitHub Pages</p>
    <h1>CI/CD 静态网页实验</h1>
    <p>本页面用于验证：提交代码后，GitHub Actions 自动校验静态入口，再发布到 GitHub Pages。</p>
    <section class="steps">
      <h2>实验链路</h2>
      <ol><li>提交并推送代码</li><li>运行静态校验、代码检查、测试与构建</li><li>通过质量检查后发布静态文件</li><li>打开线上页面核对版本</li></ol>
    </section>
    <p>页面版本：<strong id="page-version">1.0.1</strong></p>
    <p><a href="./demo/">打开实验三 React 页面</a></p>
    <footer>源文件：<code>dist/index.html</code></footer>
  </main>
</body>
</html>
